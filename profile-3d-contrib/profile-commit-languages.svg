<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Commit language distribution</title>
  <desc id="desc">Languages calculated from files changed in commits authored by seonghwan01.</desc>
  <style>
    text { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; fill: #1f2937; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #667085; }
    .metric { font-size: 22px; font-weight: 700; }
    .metric-label { font-size: 12px; fill: #667085; }
    .legend-name { font-size: 15px; font-weight: 600; }
    .legend-value { font-size: 14px; font-weight: 700; text-anchor: end; }
    .legend-muted { font-size: 12px; fill: #667085; }
  </style>
  <rect x="0.5" y="0.5" width="759" height="299" rx="8" fill="#ffffff" stroke="#d0d7de" />
  <text x="32" y="42" class="title">Commit Languages</text>
  <text x="32" y="64" class="subtitle">Changed files from commits authored by @seonghwan01</text>
  <text x="732" y="42" class="subtitle" text-anchor="end">generated by GitHub Actions</text>
  <g transform="translate(158 158)">
    <circle r="102" fill="#b07219" />
    <circle r="58" fill="#ffffff" />
    <text y="-4" text-anchor="middle" class="metric">ready</text>
    <text y="17" text-anchor="middle" class="metric-label">waiting for first run</text>
  </g>
  <g transform="translate(330 102)">
    <rect width="16" height="16" rx="3" fill="#b07219" />
    <text x="26" y="13" class="legend-name">Java</text>
    <text x="278" y="13" class="legend-value">primary</text>
    <text x="360" y="13" class="legend-muted">will refresh daily</text>
  </g>
  <g transform="translate(330 254)">
    <text class="metric">Action</text>
    <text x="76" y="0" class="metric-label">will replace this placeholder</text>
  </g>
</svg>
