<path d="M 74.571 99.317 A 102 102 0 0 0 109.273 247.608 L 130.292 208.954 A 58 58 0 0 1 110.560 124.632 Z" fill="#3178c6" stroke="#ffffff" stroke-width="2"><title>TypeScript 44 code commits</title></path>
