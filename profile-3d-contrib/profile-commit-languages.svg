<path d="M 158.000 56.000 A 102 102 0 0 0 93.835 78.711 L 121.514 112.914 A 58 58 0 0 1 158.000 100.000 Z" fill="#444444" stroke="#ffffff" stroke-width="2"><title>Other 26297 changed lines</title></path>
    <circle cx="158" cy="158" r="56" fill="#ffffff" />
